<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Big Fat Liar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(12,16,34,.42); --glass-line:rgba(255,255,255,.16);
  --yellow:#ffd23f; --orange:#ff7a2f; --red:#ff3d5a; --blue:#3fa9ff; --green:#3ddc84; --ink:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden;background:#0b1020;color:var(--ink);
  font-family:'Rubik',system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh}
.hidden{display:none!important}
.glass{
  background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}

/* ---------- HUD ---------- */
#hud{
  position:fixed;z-index:5;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;pointer-events:none;
}
.hud-left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hud-right{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.hearts{display:flex;gap:6px;padding:8px 12px}
.heart{width:26px;height:24px;transition:transform .25s}
.heart path{fill:var(--red);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.heart.empty path{fill:rgba(255,255,255,.18);filter:none}
.heart.pop{animation:hpop .45s}
@keyframes hpop{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.power{display:flex;align-items:center;gap:8px;padding:6px 12px;font-weight:700;font-size:.9rem}
.pbar{width:70px;height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#9be1ff);border-radius:4px}
.hud-center{text-align:center}
.score{
  font-family:'Russo One',sans-serif;font-size:clamp(2rem,6vw,3.3rem);line-height:1;letter-spacing:1px;
  text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(255,210,63,.25);
}
.best{font-size:.85rem;font-weight:700;opacity:.8;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.coins{display:flex;align-items:center;gap:7px;padding:8px 12px;font-family:'Russo One';font-size:1.1rem}
.coin-ico{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc61a 45%,#d48a00);box-shadow:inset 0 0 0 2px #b97700}
.icon-btn{
  pointer-events:auto;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:#fff;
  font:700 1rem 'Rubik',sans-serif;
}
.icon-btn:active{transform:scale(.92)}
#muteBtn{position:fixed;z-index:20;right:14px;bottom:max(14px,env(safe-area-inset-bottom))}

/* ---------- Банер ---------- */
#banner{
  position:fixed;z-index:6;left:50%;top:26%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;
  font-family:'Russo One',sans-serif;font-size:clamp(1.8rem,7vw,4rem);white-space:nowrap;
  color:var(--yellow);text-shadow:0 4px 0 #c2410c,0 0 30px rgba(255,210,63,.5);
}
#banner.show{animation:banner 1.6s ease-out forwards}
@keyframes banner{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  25%{transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-80%) scale(1)}
}

/* ---------- Екрани ---------- */
.screen{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at center,rgba(5,8,20,.15),rgba(5,8,20,.65));
}
.card{width:100%;max-width:520px;text-align:center;padding:28px 24px;animation:rise .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.logo{
  font-family:'Russo One',sans-serif;font-size:clamp(2.8rem,11vw,5.2rem);line-height:.95;letter-spacing:2px;
  background:linear-gradient(180deg,#fff4b0 0%,var(--yellow) 40%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #b3261e) drop-shadow(0 10px 18px rgba(0,0,0,.45));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-6px)}}
.tagline{margin:14px 0 18px;font-weight:700;font-size:1.05rem;opacity:.92}
.record{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;margin-bottom:18px;
  background:rgba(255,210,63,.14);border:1px solid rgba(255,210,63,.4);color:var(--yellow);font-weight:900;
}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px;font-size:.88rem;font-weight:700}
.chip{padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
kbd{font:900 .78rem 'Rubik';background:#fff;color:#111;border-radius:5px;padding:2px 7px;box-shadow:0 2px 0 #999;margin-right:3px}
.hint{font-size:.8rem;opacity:.7;margin-top:-12px;margin-bottom:20px}
.btn{
  width:100%;border:none;border-radius:18px;padding:17px;cursor:pointer;color:#fff;
  font:400 1.35rem 'Russo One',sans-serif;letter-spacing:1.5px;transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(4px)}
.btn-play{background:linear-gradient(180deg,#ff6b5e,#e5263d);box-shadow:0 6px 0 #9b1328,0 12px 26px rgba(229,38,61,.4)}
.btn-play:active{box-shadow:0 2px 0 #9b1328}
.btn-sec{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:1.05rem;padding:14px;margin-top:10px}
.btns{display:flex;flex-direction:column}
.over-title{font-family:'Russo One';font-size:clamp(2rem,8vw,3rem);color:var(--red);text-shadow:0 4px 0 #7a0f1e}
.big-score{font-family:'Russo One';font-size:clamp(3rem,13vw,5rem);line-height:1;margin:10px 0 6px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.big-score small{display:block;font:700 .9rem 'Rubik';opacity:.7;letter-spacing:2px;margin-top:6px}
.new-rec{display:inline-block;margin:6px 0 4px;padding:6px 14px;border-radius:20px;background:linear-gradient(90deg,#ffd23f,#ff7a2f);color:#3a1600;font-weight:900;animation:hpop .6s .2s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.stat{padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.08)}
.stat b{display:block;font-family:'Russo One';font-size:1.25rem}
.stat span{font-size:.75rem;opacity:.75;font-weight:700}

@media (max-height:480px){
  .card{padding:16px 18px}
  .logo{font-size:2.6rem}
  .tagline{margin:8px 0 10px}
  .record{margin-bottom:10px}
  .controls{margin-bottom:12px}
  .btn{padding:12px}
  .stats{margin:10px 0 12px}
  .big-score{font-size:2.6rem}
}
@media (max-width:480px){
  .heart{width:21px;height:19px}
  .hearts{padding:7px 9px;gap:4px}
  .icon-btn{width:38px;height:38px}
  .coins{padding:7px 10px;font-size:1rem}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="glass hearts" id="hearts"></div>
    <div class="glass power hidden" id="power"><span id="powerIcon">🧲</span><div class="pbar"><i id="powerBar"></i></div></div>
  </div>
  <div class="hud-center">
    <div class="score" id="score">0</div>
    <div class="best" id="bestHud">Рекорд: 0</div>
  </div>
  <div class="hud-right">
    <div class="glass coins"><span class="coin-ico"></span><b id="coins">0</b></div>
    <button class="glass icon-btn" id="pauseBtn" aria-label="Пауза">❚❚</button>
  </div>
</div>

<button class="glass icon-btn" id="muteBtn" aria-label="Звук">🔊</button>
<div id="banner"></div>

<!-- Начален екран -->
<div class="screen" id="menuScr">
  <div class="card glass">
    <div class="logo">BIG FAT<br>LIAR</div>
    <div class="tagline">Безкрайно каране из града. Колко далеч можеш да стигнеш?</div>
    <div class="record">🏆 Рекорд: <span id="bestMenu">0</span></div>
    <div class="controls">
      <span class="chip"><kbd>SPACE</kbd> скок</span>
      <span class="chip">🖱️ ляв бутон</span>
      <span class="chip">👆 докосване</span>
    </div>
    <div class="hint">Задръж за по-висок скок • <kbd>P</kbd> пауза</div>
    <button class="btn btn-play" id="playBtn">ИГРАЙ</button>
  </div>
</div>

<!-- Пауза -->
<div class="screen hidden" id="pauseScr">
  <div class="card glass">
    <div class="over-title" style="color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3)">ПАУЗА</div>
    <div class="tagline">Точки до момента: <b id="pauseScore">0</b></div>
    <div class="btns">
      <button class="btn btn-play" id="resumeBtn">ПРОДЪЛЖИ</button>
      <button class="btn btn-sec" id="quitBtn">Към менюто</button>
    </div>
  </div>
</div>

<!-- Край -->
<div class="screen hidden" id="overScr">
  <div class="card glass">
    <div class="over-title">КРАЙ НА ИГРАТА</div>
    <div class="big-score"><span id="finalScore">0</span><small>ТОЧКИ</small></div>
    <div id="newRec" class="new-rec hidden">🏆 НОВ РЕКОРД!</div>
    <div class="best" id="bestOver" style="margin-top:6px">Рекорд: 0</div>
    <div class="stats">
      <div class="stat"><b id="stDist">0 м</b><span>Разстояние</span></div>
      <div class="stat"><b id="stCoins">0</b><span>Монети</span></div>
      <div class="stat"><b id="stTime">0:00</b><span>Време</span></div>
    </div>
    <div class="btns">
      <button class="btn btn-play" id="retryBtn">ОПИТАЙ ПАК</button>
      <button class="btn btn-sec" id="menuBtn">Към менюто</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   BIG FAT LIAR — безкраен скейт раннър
   ========================================================= */

/* ---------- Помощни ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const mixA = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)];
const rgb = (A, a = 1) => `rgba(${A[0] | 0},${A[1] | 0},${A[2] | 0},${a})`;

if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

/* ---------- Запис ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let best = store.get('bfl_best', 0);

/* ---------- Звук (генериран, без файлове) ---------- */
const Snd = {
  ac: null, muted: store.get('bfl_mute', false), noise: null,
  init(){
    try{
      if (!this.ac){
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        const len = this.ac.sampleRate * 0.4, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    }catch(e){}
  },
  tone(f1, f2, dur, type = 'sine', vol = .14, when = 0){
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime + when, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  hiss(dur, vol = .2, freq = 800){
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noise; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + dur);
  },
  jump(){ this.tone(260, 560, .16, 'triangle', .12); this.hiss(.12, .05, 2500); },
  land(){ this.hiss(.08, .06, 600); },
  coin(){ this.tone(988, 0, .08, 'square', .05); this.tone(1319, 0, .16, 'square', .05, .07); },
  hit(){ this.hiss(.3, .35, 500); this.tone(160, 50, .3, 'sawtooth', .12); },
  shield(){ this.tone(1200, 300, .25, 'triangle', .1); this.hiss(.2, .1, 3000); },
  power(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0, .14, 'triangle', .1, i * .06)); },
  mile(){ [784, 988].forEach((f, i) => this.tone(f, 0, .18, 'triangle', .1, i * .09)); },
  record(){ [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0, .22, 'square', .06, i * .08)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0, .3, 'triangle', .11, i * .14)); }
};

/* ---------- Платно и мащаб ---------- */
const cv = $('game'), ctx = cv.getContext('2d');
let W, H, dpr, k, groundY, playerX;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  k = clamp(Math.min(H / 760, W / 620), .55, 1.25);
  groundY = Math.round(H - Math.max(105 * k, H * .17));
  playerX = Math.max(70 * k, Math.min(W * .17, 260));
  buildScenery();
}

/* ---------- Цикъл ден/нощ ---------- */
const SKY = [
  { p: 0.00, top: [52, 136, 214], bot: [164, 214, 247], n: 0,   warm: 0 },
  { p: 0.28, top: [52, 136, 214], bot: [164, 214, 247], n: 0,   warm: 0 },
  { p: 0.38, top: [72, 88, 168],  bot: [255, 160, 96],  n: .12, warm: 1 },
  { p: 0.47, top: [40, 34, 98],   bot: [222, 96, 112],  n: .45, warm: .7 },
  { p: 0.55, top: [8, 12, 36],    bot: [32, 38, 92],    n: 1,   warm: 0 },
  { p: 0.84, top: [8, 12, 36],    bot: [32, 38, 92],    n: 1,   warm: 0 },
  { p: 0.93, top: [64, 80, 152],  bot: [252, 182, 140], n: .3,  warm: .8 },
  { p: 1.00, top: [52, 136, 214], bot: [164, 214, 247], n: 0,   warm: 0 }
];
function skyAt(p){
  p = ((p % 1) + 1) % 1;
  for (let i = 0; i < SKY.length - 1; i++){
    const a = SKY[i], b = SKY[i + 1];
    if (p >= a.p && p <= b.p){
      const t = smooth((p - a.p) / (b.p - a.p || 1));
      return { p, top: mixA(a.top, b.top, t), bot: mixA(a.bot, b.bot, t), n: lerp(a.n, b.n, t), warm: lerp(a.warm, b.warm, t) };
    }
  }
  return { p, ...SKY[0] };
}
const CYCLE_M = 2400;   // метри за пълен ден

/* ---------- Пейзаж (паралакс) ---------- */
let stars = [], layers = {};
const MID_COLS = [[44, 60, 92], [54, 70, 104], [62, 80, 116], [40, 54, 80], [76, 94, 130], [58, 66, 96]];

function genItem(type, x){
  if (type === 'cloud') return { x, y: rand(.06, .34) * groundY, s: rand(.7, 1.5) * k, w: 160 * k, adv: rand(260, 560) * k };
  if (type === 'far'){
    const w = rand(40, 120) * k;
    return { x, w, h: rand(.22, .55) * groundY, ant: Math.random() < .25, adv: w + (Math.random() < .2 ? 8 * k : -2 * k) };
  }
  if (type === 'mid'){
    const w = Math.round(rand(95, 200) * k), h = Math.round(rand(.28, .66) * groundY);
    const cw = 24 * k, rh = 32 * k;
    const cols = Math.max(1, Math.floor((w - 24 * k) / cw)), rows = Math.max(1, Math.floor((h - 40 * k) / rh));
    const lit = []; for (let i = 0; i < cols * rows; i++) lit.push(Math.random() < .38);
    return {
      x, w, h, cols, rows, cw, rh, lit,
      padX: (w - cols * cw) / 2 + 4 * k, padY: 22 * k,
      col: MID_COLS[(Math.random() * MID_COLS.length) | 0],
      roof: Math.random() < .25 ? 'tank' : Math.random() < .35 ? 'ant' : Math.random() < .2 ? 'sign' : 'flat',
      signHue: (Math.random() * 360) | 0,
      adv: w + rand(4, 30) * k
    };
  }
  if (type === 'near'){
    const kind = Math.random() < .62 ? 'lamp' : 'tree';
    return { x, kind, w: 60 * k, adv: rand(300, 520) * k };
  }
}
function makeLayer(type, factor){
  const L = { type, factor, items: [], nextX: -100 * k };
  fillLayer(L);
  return L;
}
function fillLayer(L){
  while (L.nextX < W + 400 * k){
    const it = genItem(L.type, L.nextX);
    L.items.push(it); L.nextX += it.adv;
  }
}
function scrollLayer(L, dx){
  dx *= L.factor;
  for (const it of L.items) it.x -= dx;
  L.nextX -= dx;
  while (L.items.length && L.items[0].x + (L.items[0].w || 200) < -250 * k) L.items.shift();
  fillLayer(L);
}
function buildScenery(){
  stars = [];
  for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random() * .7, r: rand(.5, 1.7), tw: rand(0, 6.28), sp: rand(1, 3) });
  layers = {
    cloud: makeLayer('cloud', .06),
    far: makeLayer('far', .16),
    mid: makeLayer('mid', .38),
    near: makeLayer('near', 1)
  };
}

/* ---------- Състояние на играта ---------- */
const JUMP = 1060, GRAV = 4300;          // базови единици (× k)
let state = 'menu';                       // menu | play | pause | dying | over
let speed = 0, dist = 0, coins = 0, lives = 3, runTime = 0, cycleOffset = .36;
let obstacles = [], coinsArr = [], powerups = [], particles = [], floaters = [];
let spawnIn = 0, coinSpawnIn = 0, powerIn = 0, nextMile = 500, recordShown = false;
let shake = 0, slow = 0, overDelay = 0, groundScroll = 0;
let magnetT = 0, hasShield = false;

const player = {
  h: 0, vy: 0, grounded: true, holding: false, buffer: 0,
  inv: 0, squash: 0, tilt: 0, air: 0,
  pushT: 0, push: -1, wheel: 0,
  dead: false, rot: 0, vr: 0, boardX: 0, boardVX: 0, boardH: 0, boardVY: 0, boardRot: 0
};

const meters = () => dist / k / 40;
const scoreNow = () => Math.floor(meters()) + coins * 10;

/* ---------- Препятствия ---------- */
// boxes: [x, отдолу, ширина, височина] в базови единици — за сблъсък
const OB_TYPES = [
  { id: 'box',     min: 0,    w: 54,  boxes: [[0, 0, 54, 54]] },
  { id: 'cones',   min: 0 },
  { id: 'hydrant', min: 0,    w: 38,  boxes: [[4, 0, 30, 58]] },
  { id: 'trash',   min: 150,  w: 52,  boxes: [[0, 0, 52, 72]] },
  { id: 'barrier', min: 300,  w: 96,  boxes: [[0, 0, 96, 62]] },
  { id: 'stack',   min: 500,  w: 58,  boxes: [[0, 0, 58, 108]] },
  { id: 'car',     min: 800,  w: 160, boxes: [[2, 0, 156, 42], [36, 0, 92, 74]] },
  { id: 'tower',   min: 1400, w: 58,  boxes: [[0, 0, 58, 160]] }
];
const CAR_COLS = ['#e63946', '#3a86ff', '#2ec4b6', '#ffb703', '#8338ec', '#f1f1f1'];

function makeObstacle(x){
  const m = meters();
  const pool = OB_TYPES.filter(t => m >= t.min);
  // по-високите идват по-рядко
  const weights = pool.map(t => t.id === 'tower' ? .6 : t.id === 'car' ? .8 : 1);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), t = pool[0];
  for (let i = 0; i < pool.length; i++){ r -= weights[i]; if (r <= 0){ t = pool[i]; break; } }
  const o = { id: t.id, x, hit: false, kx: 0, ky: 0, vx: 0, vy: 0, rot: 0, vr: 0 };
  if (t.id === 'cones'){
    const n = m < 200 ? 1 + ((Math.random() * 2) | 0) : 1 + ((Math.random() * 3) | 0);
    o.n = n; o.w = 34 + (n - 1) * 40;
    o.boxes = []; for (let i = 0; i < n; i++) o.boxes.push([i * 40 + 4, 0, 26, 46]);
  } else {
    o.w = t.w; o.boxes = t.boxes;
  }
  if (t.id === 'car') o.color = CAR_COLS[(Math.random() * CAR_COLS.length) | 0];
  o.top = Math.max(...o.boxes.map(b => b[1] + b[3]));
  return o;
}

function spawnObstacle(){
  const o = makeObstacle(W + 60 * k);
  obstacles.push(o);
  // дъга от монети над препятствието
  if (Math.random() < .45){
    const n = 5, span = (o.w + 220) * k, peak = o.top + rand(55, 80);
    for (let i = 0; i < n; i++){
      const t = i / (n - 1);
      coinsArr.push({ x: o.x - 110 * k + t * span, hy: (o.top * .55 + Math.sin(t * Math.PI) * (peak - o.top * .55)), t: Math.random() * 6 });
    }
  }
  const m = meters();
  let gap = speed * rand(.95, 1.85) + 130 * k;
  // от време на време двойка препятствия близо едно до друго
  if (m > 600 && Math.random() < .22 && o.top < 110) gap = speed * rand(.74, .86) + 80 * k;
  spawnIn = o.w * k + gap;
}

/* ---------- Нова игра ---------- */
function resetRun(){
  speed = 520 * k; dist = 0; coins = 0; lives = 3; runTime = 0; cycleOffset = .04;
  obstacles = []; coinsArr = []; powerups = []; particles = []; floaters = [];
  spawnIn = W * .55; coinSpawnIn = W * .3;
  powerIn = rand(36000, 52000) * k;   // разстояние до първия бонус
  nextMile = 500; recordShown = false; shake = 0; slow = 0; magnetT = 0; hasShield = false;
  Object.assign(player, { h: 0, vy: 0, grounded: true, holding: false, buffer: 0, inv: 0, squash: 0, tilt: 0, air: 0,
    pushT: 0, push: -1, dead: false, rot: 0, vr: 0, boardX: 0, boardVX: 0, boardH: 0, boardVY: 0, boardRot: 0 });
  renderHearts(); renderPower();
  $('coins').textContent = '0';
  $('bestHud').textContent = 'Рекорд: ' + best;
}

function startGame(){
  Snd.init();
  resetRun();
  state = 'play';
  show('hud'); hide('menuScr'); hide('overScr'); hide('pauseScr');
}
function toMenu(){
  state = 'menu'; cycleOffset = .36; obstacles = []; coinsArr = []; powerups = []; floaters = [];
  speed = 240 * k; player.dead = false; player.h = 0; player.vy = 0; player.rot = 0; player.inv = 0; magnetT = 0; hasShield = false;
  hide('hud'); hide('overScr'); hide('pauseScr'); show('menuScr');
  $('bestMenu').textContent = best;
}
function pauseGame(){
  if (state !== 'play') return;
  state = 'pause'; player.holding = false;
  $('pauseScore').textContent = scoreNow();
  show('pauseScr');
}
function resumeGame(){
  if (state !== 'pause') return;
  hide('pauseScr'); state = 'play'; last = performance.now();
}
function die(){
  state = 'dying'; overDelay = 1.2;
  player.dead = true; player.vy = 820 * k; player.vr = -7; player.grounded = false;
  player.boardVX = 380 * k; player.boardVY = 520 * k; player.boardH = player.h;
  Snd.over();
}
function showOver(){
  state = 'over';
  const s = scoreNow(), isRec = s > best;
  if (isRec){ best = s; store.set('bfl_best', best); }
  $('finalScore').textContent = s;
  $('newRec').classList.toggle('hidden', !isRec);
  $('bestOver').textContent = 'Рекорд: ' + best;
  $('stDist').textContent = Math.floor(meters()) + ' м';
  $('stCoins').textContent = coins;
  const sec = Math.floor(runTime);
  $('stTime').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  hide('hud'); show('overScr');
  overShownAt = performance.now();
}
let overShownAt = 0;

const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');

/* ---------- HUD ---------- */
const HEART = '<svg class="heart" viewBox="0 0 32 29"><path d="M16 29 3.2 16.4C-1 12.3-1 5.6 3.2 1.9 7-1.4 12.6-.4 16 3.6 19.4-.4 25-1.4 28.8 1.9 33 5.6 33 12.3 28.8 16.4Z"/></svg>';
function renderHearts(popIdx = -1){
  $('hearts').innerHTML = [0, 1, 2].map(i => HEART.replace('class="heart"', `class="heart ${i >= lives ? 'empty' : ''} ${i === popIdx ? 'pop' : ''}"`)).join('');
}
function renderPower(){
  const el = $('power');
  if (magnetT > 0){ el.classList.remove('hidden'); $('powerIcon').textContent = '🧲'; $('powerBar').style.width = (magnetT / 9 * 100) + '%'; $('powerBar').parentElement.style.display = ''; }
  else if (hasShield){ el.classList.remove('hidden'); $('powerIcon').textContent = '🛡️ Щит'; $('powerBar').parentElement.style.display = 'none'; }
  else el.classList.add('hidden');
}
function banner(text, color){
  const b = $('banner');
  b.textContent = text; b.style.color = color || '';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
let lastScoreShown = -1;

/* ---------- Частици ---------- */
function puff(x, y, n, opts = {}){
  for (let i = 0; i < n; i++){
    particles.push({
      x, y, vx: rand(-1, 1) * (opts.sx || 120) * k + (opts.vx || 0), vy: -rand(.2, 1) * (opts.sy || 90) * k,
      life: 0, max: rand(.35, .7) * (opts.life || 1), r: rand(3, 7) * k * (opts.size || 1),
      color: opts.color || [210, 210, 220], type: opts.type || 'dust', g: opts.g ?? 200
    });
  }
}
function floatText(text, x, y, color){ floaters.push({ text, x, y, life: 0, color }); }

/* ---------- Въвеждане ---------- */
function press(){
  if (state === 'play'){
    player.holding = true; player.buffer = .13;
  } else if (state === 'menu'){
    startGame();
  } else if (state === 'over' && performance.now() - overShownAt > 700){
    startGame();
  }
}
function release(){ player.holding = false; }

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    if (!e.repeat) press();
  } else if (e.code === 'Enter'){
    if (state === 'menu' || state === 'over') press();
    else if (state === 'pause') resumeGame();
  } else if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); release(); }
});
window.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (e.button !== undefined && e.button !== 0) return;
  if (state === 'play'){ e.preventDefault(); Snd.init(); press(); }
});
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => pauseGame());

function bindBtn(id, fn){ $(id).addEventListener('click', e => { e.currentTarget.blur(); fn(); }); }
bindBtn('playBtn', startGame);
bindBtn('retryBtn', startGame);
bindBtn('menuBtn', toMenu);
bindBtn('quitBtn', toMenu);
bindBtn('resumeBtn', resumeGame);
bindBtn('pauseBtn', pauseGame);
bindBtn('muteBtn', () => {
  Snd.muted = !Snd.muted; store.set('bfl_mute', Snd.muted);
  $('muteBtn').textContent = Snd.muted ? '🔇' : '🔊';
  if (!Snd.muted){ Snd.init(); Snd.coin(); }
});
$('muteBtn').textContent = Snd.muted ? '🔇' : '🔊';

/* ---------- ОБНОВЯВАНЕ ---------- */
function update(dt){
  const P = player;

  // Скорост
  if (state === 'play'){
    runTime += dt;
    // на тесни екрани (телефон изправен) максималната скорост е по-ниска, за да има време за реакция
    const cap = Math.min(1180 * k, Math.max(W * 1.3, 700 * k));
    speed = Math.min((520 + runTime * 7.5) * k, cap);
  } else if (state === 'menu'){
    speed = lerp(speed, 240 * k, dt * 2);
  } else if (state === 'dying' || state === 'over'){
    speed = Math.max(0, speed - 900 * k * dt);
  }
  const dx = speed * dt;
  dist += (state === 'play') ? dx : 0;
  if (state === 'menu') cycleOffset += dt * .004;
  groundScroll += dx;

  for (const key in layers) scrollLayer(layers[key], dx);

  // Скейтърът
  P.wheel += dx / (5 * k);
  P.squash = Math.max(0, P.squash - dt * 2.2);
  if (P.inv > 0) P.inv -= dt;

  if (!P.dead){
    if (P.buffer > 0) P.buffer -= dt;
    if (state === 'play' && P.buffer > 0 && P.grounded){
      P.vy = JUMP * k; P.grounded = false; P.buffer = 0; P.push = -1;
      Snd.jump();
      puff(playerX - 10 * k, groundY, 6, { vx: -speed * .3 });
    }
    if (!P.grounded){
      const g = (P.holding && P.vy > 0) ? GRAV * .58 : GRAV;
      P.vy -= g * k * dt;
      P.h += P.vy * dt;
      if (P.h <= 0){
        const impact = clamp(-P.vy / (JUMP * k), 0, 1.3);
        P.h = 0; P.vy = 0; P.grounded = true;
        P.squash = .1 + impact * .14;
        puff(playerX, groundY, 8 + (impact * 6 | 0), { vx: -speed * .35, sx: 140 });
        Snd.land();
      }
    }
    P.air = lerp(P.air, P.grounded ? 0 : 1, dt * 10);
    P.tilt = P.grounded ? lerp(P.tilt, 0, dt * 14) : clamp(-P.vy / (JUMP * k) * .22, -.25, .25);

    // отблъскване с крак
    if (P.grounded && state !== 'over'){
      if (P.push < 0){
        P.pushT += dt;
        if (P.pushT > (state === 'play' ? 1.5 : 2.2)){ P.pushT = 0; P.push = 0; }
      } else {
        const prev = P.push;
        P.push += dt / .45;
        if (prev < .5 && P.push >= .5) puff(playerX - 34 * k, groundY, 3, { vx: -speed * .4, sx: 60, sy: 40, size: .7 });
        if (P.push >= 1) P.push = -1;
      }
    } else P.push = -1;
  } else {
    // падане
    if (!P.grounded){
      P.vy -= GRAV * k * dt; P.h += P.vy * dt; P.rot += P.vr * dt;
      if (P.h <= 0){
        P.h = 0; P.grounded = true; P.rot = -1.45; shake = Math.max(shake, .25);
        puff(playerX, groundY, 14, { sx: 200 });
      }
    }
    P.boardX += P.boardVX * dt; P.boardVX *= (1 - dt * .8);
    if (P.boardH > 0 || P.boardVY > 0){ P.boardVY -= GRAV * k * dt; P.boardH = Math.max(0, P.boardH + P.boardVY * dt); P.boardRot += dt * 9; if (P.boardH === 0){ P.boardVY = 0; P.boardRot = 0; } }
    if (state === 'dying'){ overDelay -= dt; if (overDelay <= 0) showOver(); }
  }

  // Спаун (само в игра)
  if (state === 'play'){
    spawnIn -= dx;
    if (spawnIn <= 0) spawnObstacle();

    coinSpawnIn -= dx;
    if (coinSpawnIn <= 0){
      // редица монети ниско, далеч от препятствия
      const lastO = obstacles[obstacles.length - 1];
      const x0 = W + 40 * k;
      if (!lastO || x0 - (lastO.x + lastO.w * k) > 140 * k){
        if (spawnIn > 320 * k){
          const n = 3 + ((Math.random() * 4) | 0);
          for (let i = 0; i < n; i++) coinsArr.push({ x: x0 + i * 42 * k, hy: 36, t: i * .4 });
        }
      }
      coinSpawnIn = rand(500, 1100) * k;
    }

    powerIn -= dx;
    if (powerIn <= 0 && spawnIn > 260 * k){
      const opts = ['shield', 'magnet'];
      if (lives < 3) opts.push('heart', 'heart');
      powerups.push({ x: W + 50 * k, hy: rand(110, 170), type: opts[(Math.random() * opts.length) | 0], t: 0 });
      powerIn = rand(36000, 56000) * k;
    }
  }

  // Препятствия и сблъсък
  const pl = { l: playerX - 15 * k, r: playerX + 15 * k, b: groundY - P.h - 8 * k, t: groundY - P.h - (100 - P.squash * 60) * k };
  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= dx;
    if (o.hit){
      o.kx += o.vx * dt; o.vy -= GRAV * k * dt; o.ky += o.vy * dt; o.rot += o.vr * dt;
    } else if (state === 'play' && !P.dead){
      const pad = 6 * k;
      for (const b of o.boxes){
        const L = o.x + b[0] * k + pad, R = o.x + (b[0] + b[2]) * k - pad;
        const T = groundY - (b[1] + b[3]) * k + pad, B = groundY - b[1] * k;
        if (pl.r > L && pl.l < R && pl.b > T && pl.t < B){ onHit(o); break; }
      }
    }
    if (o.x + o.w * k + o.kx < -200 * k || o.ky < -2000 * k) obstacles.splice(i, 1);
  }

  // Монети
  const pcx = playerX, pcy = groundY - P.h - 55 * k;
  for (let i = coinsArr.length - 1; i >= 0; i--){
    const c = coinsArr[i];
    c.x -= dx; c.t += dt;
    let cy = groundY - c.hy * k;
    if (magnetT > 0 && !P.dead){
      const ddx = pcx - c.x, ddy = pcy - cy, d = Math.hypot(ddx, ddy);
      if (d < 330 * k){
        c.mag = true;
        const pull = Math.min(1, dt * 9);
        c.x += ddx * pull; c.hy += (ddy * -pull) / k; cy = groundY - c.hy * k;
      }
    }
    if (state === 'play' && !P.dead && Math.hypot(pcx - c.x, pcy - cy) < 48 * k){
      coins++; $('coins').textContent = coins; Snd.coin();
      puff(c.x, cy, 6, { color: [255, 214, 60], type: 'spark', sx: 160, sy: 160, g: 0, size: .6 });
      coinsArr.splice(i, 1); continue;
    }
    if (c.x < -60 * k) coinsArr.splice(i, 1);
  }

  // Бонуси
  for (let i = powerups.length - 1; i >= 0; i--){
    const u = powerups[i];
    u.x -= dx; u.t += dt;
    const uy = groundY - (u.hy + Math.sin(u.t * 3) * 8) * k;
    if (state === 'play' && !P.dead && Math.hypot(pcx - u.x, pcy - uy) < 58 * k){
      Snd.power();
      if (u.type === 'heart'){ lives = Math.min(3, lives + 1); renderHearts(lives - 1); floatText('+1 ЖИВОТ', u.x, uy, '#ff5c7a'); }
      if (u.type === 'shield'){ hasShield = true; floatText('ЩИТ!', u.x, uy, '#7fd6ff'); }
      if (u.type === 'magnet'){ magnetT = 9; floatText('МАГНИТ!', u.x, uy, '#ffd23f'); }
      puff(u.x, uy, 14, { color: [255, 255, 255], type: 'spark', sx: 220, sy: 220, g: 0, size: .6 });
      renderPower();
      powerups.splice(i, 1); continue;
    }
    if (u.x < -80 * k) powerups.splice(i, 1);
  }
  if (magnetT > 0){ magnetT -= dt; if (magnetT <= 0){ magnetT = 0; } renderPower(); }

  // Частици
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * k * dt;
    if (p.type === 'dust') p.vx *= (1 - dt * 2);
  }
  // линии на скорост
  if (state === 'play' && speed > 820 * k && Math.random() < (speed / k - 820) / 900){
    particles.push({ x: W + 20, y: rand(groundY * .25, groundY - 10 * k), vx: -speed * 2.2, vy: 0, life: 0, max: .5, r: rand(40, 110) * k, color: [255, 255, 255], type: 'line', g: 0 });
  }
  for (let i = floaters.length - 1; i >= 0; i--){ const f = floaters[i]; f.life += dt; f.y -= 50 * k * dt; if (f.life > 1.1) floaters.splice(i, 1); }

  if (shake > 0) shake = Math.max(0, shake - dt);

  // Точки, етапи, рекорд
  if (state === 'play'){
    const s = scoreNow();
    if (s !== lastScoreShown){ $('score').textContent = s; lastScoreShown = s; }
    if (meters() >= nextMile){ banner(nextMile + ' м'); Snd.mile(); nextMile += 500; }
    if (!recordShown && best > 0 && s > best){ recordShown = true; banner('НОВ РЕКОРД!'); Snd.record(); $('bestHud').textContent = 'Рекорд: побит! 🔥'; }
  }
}

function onHit(o){
  const P = player;
  if (P.inv > 0) return;
  o.hit = true; o.vx = 260 * k; o.vy = 620 * k; o.vr = rand(5, 9);
  if (hasShield){
    hasShield = false; P.inv = .8; Snd.shield(); renderPower();
    puff(playerX, groundY - P.h - 55 * k, 18, { color: [127, 214, 255], type: 'spark', sx: 260, sy: 260, g: 0, size: .7 });
    floatText('ЩИТЪТ ТЕ СПАСИ', playerX + 40 * k, groundY - P.h - 130 * k, '#7fd6ff');
    return;
  }
  lives--; renderHearts(lives);
  Snd.hit(); shake = .35; slow = .3;
  puff(o.x + o.w * k / 2, groundY - o.top * k / 2, 14, { color: [255, 120, 80], type: 'spark', sx: 260, sy: 260, size: .7 });
  if (lives <= 0){ die(); return; }
  P.inv = 1.5;
}

/* ---------- РИСУВАНЕ ---------- */
function draw(){
  const sky = skyAt(cycleOffset + meters() / CYCLE_M);
  ctx.save();
  if (shake > 0){ const s = shake * 22 * k; ctx.translate(rand(-s, s), rand(-s, s)); }

  drawSky(sky);
  drawClouds(sky);
  drawFar(sky);
  drawMid(sky);
  drawGround(sky);
  drawNear(sky, false);
  drawObstacles();

  // нощно потъмняване на преден план (плавно отгоре надолу)
  if (sky.n > 0.02){
    const gtop = groundY - 320 * k;
    const g = ctx.createLinearGradient(0, gtop, 0, groundY);
    g.addColorStop(0, 'rgba(8,12,40,0)');
    g.addColorStop(1, `rgba(8,12,40,${sky.n * .38})`);
    ctx.fillStyle = g; ctx.fillRect(-50, gtop, W + 100, groundY - gtop);
    ctx.fillStyle = `rgba(8,12,40,${sky.n * .38})`; ctx.fillRect(-50, groundY, W + 100, H - groundY + 50);
  }
  drawNear(sky, true);   // светлини на лампите

  drawPowerups();
  drawCoins();
  drawPlayer(sky);
  drawParticles();
  drawFloaters();
  ctx.restore();

  // винетка
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawSky(sky){
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, rgb(sky.top)); g.addColorStop(1, rgb(sky.bot));
  ctx.fillStyle = g; ctx.fillRect(-50, -50, W + 100, groundY + 60);

  // звезди
  if (sky.n > .05){
    const t = performance.now() / 1000;
    for (const s of stars){
      const a = sky.n * (.45 + .55 * Math.sin(t * s.sp + s.tw));
      if (a <= 0) continue;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x * W, s.y * groundY, s.r, s.r);
    }
  }

  // слънце / луна
  const p = sky.p;
  const isSun = p < .5;
  const s = isSun ? p / .5 : (p - .5) / .5;
  const cx = W * (.12 + .76 * s), cy = groundY * .92 - Math.sin(s * Math.PI) * groundY * .72;
  const r = (isSun ? 46 : 34) * k;
  if (isSun){
    const glow = ctx.createRadialGradient(cx, cy, r * .4, cx, cy, r * 4);
    glow.addColorStop(0, `rgba(255,230,150,${.55 + sky.warm * .2})`); glow.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, r * 4, 0, 7); ctx.fill();
    ctx.fillStyle = rgb(mixA([255, 246, 210], [255, 150, 80], sky.warm));
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  } else {
    const glow = ctx.createRadialGradient(cx, cy, r * .5, cx, cy, r * 3.5);
    glow.addColorStop(0, `rgba(200,215,255,${.3 * sky.n})`); glow.addColorStop(1, 'rgba(200,215,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, r * 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(236,240,255,${.35 + .65 * sky.n})`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(190,198,225,${.6 * sky.n})`;
    [[-.3, -.2, .22], [.25, .15, .16], [-.05, .35, .12]].forEach(([a, b, c]) => { ctx.beginPath(); ctx.arc(cx + a * r, cy + b * r, c * r, 0, 7); ctx.fill(); });
  }
}

function drawClouds(sky){
  const col = mixA(mixA([255, 255, 255], [255, 196, 170], sky.warm * .8), [70, 80, 130], sky.n * .8);
  ctx.fillStyle = rgb(col, .85 - sky.n * .45);
  for (const c of layers.cloud.items){
    const x = c.x, y = c.y, s = c.s;
    ctx.beginPath();
    ctx.ellipse(x + 40 * s, y, 42 * s, 20 * s, 0, 0, 7);
    ctx.ellipse(x + 78 * s, y - 12 * s, 34 * s, 24 * s, 0, 0, 7);
    ctx.ellipse(x + 112 * s, y + 2 * s, 38 * s, 18 * s, 0, 0, 7);
    ctx.fill();
  }
}

function drawFar(sky){
  const col = mixA(mixA(sky.bot, sky.top, .35), [10, 14, 30], .38 + sky.n * .2);
  ctx.fillStyle = rgb(col);
  for (const b of layers.far.items){
    ctx.fillRect(b.x, groundY - b.h, b.w + 1, b.h);
    if (b.ant){ ctx.fillRect(b.x + b.w / 2 - 1.5 * k, groundY - b.h - 28 * k, 3 * k, 28 * k); }
  }
  // мъгла над хоризонта
  const g = ctx.createLinearGradient(0, groundY - groundY * .35, 0, groundY);
  g.addColorStop(0, rgb(sky.bot, 0)); g.addColorStop(1, rgb(sky.bot, .35));
  ctx.fillStyle = g; ctx.fillRect(-50, groundY - groundY * .35, W + 100, groundY * .35);
}

function drawMid(sky){
  const t = performance.now() / 1000;
  for (const b of layers.mid.items){
    if (b.x > W + 10 || b.x + b.w < -10) continue;
    const top = groundY - b.h;
    let col = mixA(b.col, [14, 18, 40], sky.n * .62);
    col = mixA(col, [150, 80, 90], sky.warm * .18);
    ctx.fillStyle = rgb(col); ctx.fillRect(b.x, top, b.w, b.h);
    // светла лява страна / сенчеста дясна
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(b.x, top, 5 * k, b.h);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(b.x + b.w - 7 * k, top, 7 * k, b.h);
    // покрив
    ctx.fillStyle = rgb(mixA(col, [0, 0, 0], .25));
    ctx.fillRect(b.x - 3 * k, top - 6 * k, b.w + 6 * k, 6 * k);
    if (b.roof === 'tank'){
      ctx.fillRect(b.x + b.w * .62, top - 30 * k, 28 * k, 22 * k);
      ctx.fillRect(b.x + b.w * .62 + 4 * k, top - 8 * k, 3 * k, 4 * k);
      ctx.fillRect(b.x + b.w * .62 + 21 * k, top - 8 * k, 3 * k, 4 * k);
    } else if (b.roof === 'ant'){
      ctx.fillRect(b.x + b.w * .3, top - 46 * k, 3 * k, 40 * k);
      if (sky.n > .2 && Math.sin(t * 3 + b.x) > 0){ ctx.fillStyle = `rgba(255,60,60,${sky.n})`; ctx.beginPath(); ctx.arc(b.x + b.w * .3 + 1.5 * k, top - 47 * k, 3.5 * k, 0, 7); ctx.fill(); }
    } else if (b.roof === 'sign'){
      const sw = Math.min(b.w * .7, 120 * k), sx = b.x + (b.w - sw) / 2;
      ctx.fillRect(sx + 10 * k, top - 14 * k, 3 * k, 10 * k); ctx.fillRect(sx + sw - 13 * k, top - 14 * k, 3 * k, 10 * k);
      const glow = sky.n > .3;
      ctx.fillStyle = glow ? `hsla(${b.signHue},95%,62%,${.55 + .45 * sky.n})` : `hsl(${b.signHue},55%,45%)`;
      if (glow){ ctx.shadowColor = `hsl(${b.signHue},95%,60%)`; ctx.shadowBlur = 18 * k; }
      ctx.beginPath(); ctx.roundRect(sx, top - 40 * k, sw, 26 * k, 5 * k); ctx.fill();
      ctx.shadowBlur = 0;
    }
    // прозорци
    for (let r = 0; r < b.rows; r++){
      for (let c = 0; c < b.cols; c++){
        const wx = b.x + b.padX + c * b.cw, wy = top + b.padY + r * b.rh;
        const lit = b.lit[r * b.cols + c];
        const ww = b.cw - 9 * k, wh = b.rh - 13 * k;
        if (sky.n < .98){
          ctx.fillStyle = `rgba(185,222,255,${.28 * (1 - sky.n)})`;
          ctx.fillRect(wx, wy, ww, wh);
        }
        if (sky.n > .05){
          ctx.fillStyle = lit ? `rgba(255,212,120,${sky.n * .95})` : `rgba(10,14,30,${sky.n * .5})`;
          ctx.fillRect(wx, wy, ww, wh);
        }
      }
    }
  }
}

function drawGround(sky){
  const night = sky.n;
  const swH = 30 * k;
  // тротоар
  ctx.fillStyle = rgb(mixA([176, 184, 194], [60, 66, 90], night * .7));
  ctx.fillRect(-50, groundY, W + 100, swH);
  ctx.fillStyle = rgb(mixA([214, 220, 228], [90, 96, 124], night * .7));
  ctx.fillRect(-50, groundY, W + 100, 4 * k);
  // плочки
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  const tile = 70 * k, off = groundScroll % tile;
  for (let x = -off; x < W + tile; x += tile) ctx.fillRect(x, groundY + 4 * k, 2 * k, swH - 4 * k);
  // бордюр
  ctx.fillStyle = rgb(mixA([120, 128, 140], [40, 44, 64], night * .7));
  ctx.fillRect(-50, groundY + swH, W + 100, 8 * k);
  // път
  const roadTop = groundY + swH + 8 * k;
  const rg = ctx.createLinearGradient(0, roadTop, 0, H);
  rg.addColorStop(0, rgb(mixA([62, 68, 80], [26, 28, 42], night * .7)));
  rg.addColorStop(1, rgb(mixA([44, 48, 58], [16, 18, 30], night * .7)));
  ctx.fillStyle = rg; ctx.fillRect(-50, roadTop, W + 100, H - roadTop + 50);
  // маркировка
  const ly = roadTop + (H - roadTop) * .5;
  ctx.fillStyle = `rgba(255,220,120,${.75 - night * .25})`;
  const dash = 90 * k, doff = (groundScroll * 1.15) % (dash * 2);
  for (let x = -doff; x < W + dash; x += dash * 2) ctx.fillRect(x, ly - 2.5 * k, dash, 5 * k);
}

function drawNear(sky, lights){
  for (const it of layers.near.items){
    const x = it.x;
    if (x < -150 * k || x > W + 150 * k) continue;
    if (it.kind === 'lamp'){
      const top = groundY - 190 * k;
      if (!lights){
        ctx.fillStyle = rgb(mixA([60, 66, 80], [24, 26, 40], sky.n * .5));
        ctx.fillRect(x - 3 * k, top, 6 * k, 190 * k);
        ctx.fillRect(x - 8 * k, groundY - 10 * k, 16 * k, 10 * k);
        ctx.beginPath(); ctx.moveTo(x, top + 4 * k); ctx.quadraticCurveTo(x + 4 * k, top - 14 * k, x + 34 * k, top - 6 * k); ctx.lineWidth = 5 * k; ctx.strokeStyle = ctx.fillStyle; ctx.stroke();
        ctx.beginPath(); ctx.roundRect(x + 24 * k, top - 8 * k, 26 * k, 9 * k, 4 * k); ctx.fill();
      } else if (sky.n > .15){
        const lx = x + 37 * k, ly = top + 2 * k;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const cone = ctx.createLinearGradient(0, ly, 0, groundY);
        cone.addColorStop(0, `rgba(255,214,140,${.22 * sky.n})`); cone.addColorStop(1, 'rgba(255,214,140,0)');
        ctx.fillStyle = cone;
        ctx.beginPath(); ctx.moveTo(lx - 10 * k, ly); ctx.lineTo(lx + 10 * k, ly); ctx.lineTo(lx + 70 * k, groundY); ctx.lineTo(lx - 70 * k, groundY); ctx.fill();
        const gl = ctx.createRadialGradient(lx, ly, 0, lx, ly, 40 * k);
        gl.addColorStop(0, `rgba(255,230,170,${.9 * sky.n})`); gl.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(lx, ly, 40 * k, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(255,214,140,${.18 * sky.n})`;
        ctx.beginPath(); ctx.ellipse(lx, groundY + 8 * k, 80 * k, 12 * k, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
    } else if (!lights){
      // дърво в саксия
      const g = mixA([46, 160, 90], [20, 50, 50], sky.n * .7);
      ctx.fillStyle = rgb(mixA([110, 74, 44], [40, 30, 30], sky.n * .6));
      ctx.fillRect(x - 4 * k, groundY - 70 * k, 8 * k, 70 * k);
      ctx.fillStyle = rgb(g);
      ctx.beginPath();
      ctx.arc(x, groundY - 96 * k, 34 * k, 0, 7);
      ctx.arc(x - 26 * k, groundY - 78 * k, 24 * k, 0, 7);
      ctx.arc(x + 26 * k, groundY - 80 * k, 26 * k, 0, 7);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.arc(x - 10 * k, groundY - 108 * k, 14 * k, 0, 7); ctx.fill();
      ctx.fillStyle = rgb(mixA([150, 156, 168], [50, 54, 72], sky.n * .6));
      ctx.fillRect(x - 16 * k, groundY - 14 * k, 32 * k, 14 * k);
    }
  }
}

/* --- препятствия (в базови единици, начало долу вляво) --- */
function crate(x, y, w, h){
  ctx.fillStyle = '#c98d4b'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 3); ctx.fill();
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#e8c48c'; ctx.fillRect(x + w / 2 - 5, y, 10, h);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x + w - 8, y + 3, 5, h - 6);
  ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 10, y + h - 12); ctx.lineTo(x + 10, y + h - 24); ctx.moveTo(x + 6, y + h - 20); ctx.lineTo(x + 10, y + h - 25); ctx.lineTo(x + 14, y + h - 20); ctx.stroke();
}

      ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 0; i < 3; i++) ctx.fillRect(14 + i * 10, -54, 4, 40);

function drawObstacles(){
  for (const o of obstacles){
    if (o.x > W + 50 * k) continue;
    ctx.save();
    ctx.translate(o.x + o.kx, groundY - o.ky);
    ctx.scale(k, k);
    if (o.hit){ ctx.translate(o.w / 2, -o.top / 2); ctx.rotate(o.rot); ctx.translate(-o.w / 2, o.top / 2); }
    else { ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(o.w / 2, 0, o.w / 2 + 6, 5, 0, 0, 7); ctx.fill(); }
    drawObstacle(o);
    ctx.restore();
  }
}

function drawCoins(){
  for (const c of coinsArr){

    const s = Math.abs(Math.cos(c.t * 5)) * .85 + .15, r = 13 * k;

    ctx.fillStyle = '#d48a00'; ctx.beginPath(); ctx.ellipse(x, y, r * s, r, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffc61a'; ctx.beginPath(); ctx.ellipse(x, y, r * s * .8, r * .8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.ellipse(x - r * .25 * s, y - r * .3, r * .22 * s, r * .3, 0, 0, 7); ctx.fill();

function drawPowerups(){
  for (const u of powerups){
    const x = u.x, y = groundY - (u.hy + Math.sin(u.t * 3) * 8) * k, r = 24 * k;
    const col = u.type === 'heart' ? [255, 80, 110] : u.type === 'shield' ? [90, 200, 255] : [255, 210, 63];
    const pulse = 1 + Math.sin(u.t * 6) * .08;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2 * pulse);
    g.addColorStop(0, rgb(col, .55)); g.addColorStop(1, rgb(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.strokeStyle = rgb(col); ctx.lineWidth = 3 * k;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    if (u.type === 'heart'){
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath(); ctx.moveTo(0, 11); ctx.bezierCurveTo(-18, -2, -10, -16, 0, -6); ctx.bezierCurveTo(10, -16, 18, -2, 0, 11); ctx.fill();
    } else if (u.type === 'shield'){

      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(12, -8); ctx.lineTo(10, 4); ctx.quadraticCurveTo(6, 11, 0, 14); ctx.quadraticCurveTo(-6, 11, -10, 4); ctx.lineTo(-12, -8); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-2, -8, 4, 16);
    } else {
      ctx.lineWidth = 7; ctx.strokeStyle = '#e63946'; ctx.lineCap = 'butt';

    }

  }

/* --- скейтърът (в базови единици; начало = под дъската, по средата) --- */
function drawBoard(rot){

  for (const wx of [-20, 20]){
    ctx.fillStyle = '#f3f3f3'; ctx.beginPath(); ctx.arc(wx, -5, 5.5, 0, 7); ctx.fill();

    ctx.moveTo(wx + Math.cos(rot) * 4, -5 + Math.sin(rot) * 4); ctx.lineTo(wx - Math.cos(rot) * 4, -5 - Math.sin(rot) * 4); ctx.stroke();
  }
  ctx.fillStyle = '#1e2230';
  ctx.beginPath(); ctx.moveTo(-40, -19); ctx.quadraticCurveTo(-36, -12, -30, -11); ctx.lineTo(30, -11); ctx.quadraticCurveTo(36, -12, 40, -19); ctx.lineTo(36, -18); ctx.quadraticCurveTo(33, -15, 28, -15); ctx.lineTo(-28, -15); ctx.quadraticCurveTo(-33, -15, -36, -18); ctx.fill();
  ctx.fillStyle = '#ff3d5a'; ctx.fillRect(-26, -12.5, 52, 2);
}

function limb(ax, ay, bx, by, cx, cy, w, col){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.stroke();
}

function drawRider(P){
  const c = clamp(P.squash * 2.6 + P.air * .3, 0, 1);       // клякане
  const pp = P.push >= 0 ? Math.sin(P.push * Math.PI) : 0;    // отблъскване
  const deck = -15;
  const ff = { x: 15, y: deck }, bf = { x: -15 - 26 * pp, y: deck + 17 * pp };
  if (P.air > .5){ ff.y -= 2; bf.y -= 2; }
  const hip = { x: -2 + c * 2, y: deck - 42 + c * 14 };
  const kf = { x: (hip.x + ff.x) / 2 + 9 + c * 6, y: (hip.y + ff.y) / 2 - c * 2 };
  const kb = { x: (hip.x + bf.x) / 2 + 5 + c * 8 - pp * 4, y: (hip.y + bf.y) / 2 - c * 2 };

  // задни крайници (по-тъмни)
  limb(hip.x, hip.y, kb.x, kb.y, bf.x, bf.y, 11, '#223d66');
  ctx.fillStyle = '#e9e9ee'; ctx.beginPath(); ctx.roundRect(bf.x - 8, bf.y - 6, 18, 7, 3); ctx.fill();
  ctx.fillStyle = '#ff3d5a'; ctx.fillRect(bf.x - 8, bf.y - 1, 18, 2);

  const lean = .16 + c * .18 + P.air * .05 + Math.min(.08, speed / k / 12000);
  const t = performance.now() / 1000;
  const swing = Math.sin(t * 5) * .12;
  // ръце: ъгъл спрямо вертикала надолу (+ = напред)
  const backArm = lerp(-.75 + swing, -2.1, P.air), frontArm = lerp(.55 - swing, 2.0, P.air);

  ctx.save(); ctx.translate(hip.x, hip.y); ctx.rotate(lean);
  // задна ръка
  const sh = { x: 1, y: -34 };
  const ba = { x: sh.x + Math.sin(backArm) * 25, y: sh.y + Math.cos(backArm) * 25 };
  limb(sh.x, sh.y, (sh.x + ba.x) / 2 - 2, (sh.y + ba.y) / 2, ba.x, ba.y, 8, '#c4521a');
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(ba.x, ba.y, 4.5, 0, 7); ctx.fill();
  ctx.restore();

  // предни крака
  limb(hip.x, hip.y, kf.x, kf.y, ff.x, ff.y, 11, '#2d5189');
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(ff.x - 8, ff.y - 6, 19, 7, 3); ctx.fill();
  ctx.fillStyle = '#ff3d5a'; ctx.fillRect(ff.x - 8, ff.y - 1, 19, 2);

  ctx.save(); ctx.translate(hip.x, hip.y); ctx.rotate(lean);
  // тяло (суитшърт)
  ctx.fillStyle = '#ff7a2f';
  ctx.beginPath(); ctx.roundRect(-13, -40, 27, 44, 9); ctx.fill();
  ctx.fillStyle = '#e8611a'; ctx.beginPath(); ctx.roundRect(-13, -2, 27, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.roundRect(-6, -16, 16, 9, 4); ctx.fill();
  ctx.fillStyle = '#e8611a'; ctx.beginPath(); ctx.ellipse(-8, -38, 9, 6, -.3, 0, 7); ctx.fill(); // качулка
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(4, -38); ctx.lineTo(5, -28); ctx.moveTo(8, -38); ctx.lineTo(9, -30); ctx.stroke();
  // глава
  ctx.fillStyle = '#e8b48a'; ctx.fillRect(-2, -46, 8, 8);
  ctx.beginPath(); ctx.arc(2, -56, 12.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3418'; ctx.beginPath(); ctx.arc(-1, -58, 11, Math.PI * .55, Math.PI * 1.25); ctx.fill();
  // шапка обърната назад
  ctx.fillStyle = '#e0283c'; ctx.beginPath(); ctx.arc(2, -58, 12.8, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-20, -62, 14, 5, 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(3, -70, 2.2, 0, 7); ctx.fill();
  // очила
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(5, -59, 11, 5, 2); ctx.fill(); ctx.fillRect(-2, -58, 8, 2);
  ctx.fillStyle = 'rgba(120,200,255,.7)'; ctx.fillRect(9, -58, 4, 1.5);
  // усмивка
  ctx.strokeStyle = '#7a3e1f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(10, -50, 3, .2, 1.4); ctx.stroke();
  // предна ръка
  const fa = { x: sh.x + Math.sin(frontArm) * 25, y: sh.y + Math.cos(frontArm) * 25 };
  limb(sh.x + 2, sh.y, (sh.x + fa.x) / 2 + 3, (sh.y + fa.y) / 2, fa.x, fa.y, 8.5, '#ff7a2f');
  ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(fa.x, fa.y, 4.8, 0, 7); ctx.fill();
  ctx.restore();
}

function drawPlayer(sky){
  const P = player;
  // сянка
  const s = clamp(1 - P.h / (300 * k), .25, 1);
  ctx.fillStyle = `rgba(0,0,0,${.3 * s})`;
  ctx.beginPath(); ctx.ellipse(playerX, groundY + 3 * k, 42 * k * s, 7 * k * s, 0, 0, 7); ctx.fill();

  const blink = P.inv > 0 && !P.dead && Math.floor(P.inv * 12) % 2 === 0;
  ctx.save();
  ctx.globalAlpha = blink ? .35 : 1;

  if (P.dead){
    // дъската се търкаля напред
    ctx.save(); ctx.translate(playerX + P.boardX, groundY - P.boardH); ctx.scale(k, k); ctx.rotate(P.boardRot); drawBoard(P.wheel); ctx.restore();
    ctx.save(); ctx.translate(playerX, groundY - P.h); ctx.scale(k, k); ctx.rotate(P.rot);
    drawRider({ ...P, squash: 0, air: 1, push: -1 }); ctx.restore();
  } else {
    ctx.save();
    ctx.translate(playerX, groundY - P.h); ctx.scale(k, k); ctx.rotate(P.tilt);
    drawBoard(P.wheel);
    ctx.save(); ctx.translate(0, -15); ctx.scale(1 + P.squash * .3, 1 - P.squash); ctx.translate(0, 15);
    drawRider(P);
    ctx.restore();
    ctx.restore();
  }
  ctx.restore();

  // щит
  if (hasShield && !P.dead){
    const cx = playerX, cy = groundY - P.h - 50 * k, r = 68 * k, t = performance.now() / 1000;
    const g = ctx.createRadialGradient(cx, cy, r * .6, cx, cy, r);
    g.addColorStop(0, 'rgba(90,200,255,0)'); g.addColorStop(1, `rgba(90,200,255,${.35 + Math.sin(t * 5) * .08})`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(160,230,255,.7)'; ctx.lineWidth = 2 * k; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  }
  // ореол на магнита
  if (magnetT > 0 && !P.dead){
    const t = performance.now() / 1000;
    ctx.strokeStyle = `rgba(255,210,63,${.25 + Math.sin(t * 8) * .1})`; ctx.lineWidth = 2 * k;
    ctx.setLineDash([6 * k, 8 * k]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.arc(playerX, groundY - P.h - 50 * k, 90 * k, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawParticles(){
  for (const p of particles){
    const a = 1 - p.life / p.max;
    if (p.type === 'line'){
      ctx.fillStyle = `rgba(255,255,255,${.35 * a})`; ctx.fillRect(p.x, p.y, p.r, 2 * k);
    } else if (p.type === 'spark'){
      ctx.fillStyle = rgb(p.color, a); ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.5 + a * .5), 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = rgb(p.color, a * .55); ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - a)), 0, 7); ctx.fill();
    }
  }
}
function drawFloaters(){
  ctx.textAlign = 'center';
  for (const f of floaters){
    const a = 1 - f.life / 1.1;
    ctx.font = `400 ${Math.round(22 * k)}px 'Russo One', sans-serif`;
    ctx.fillStyle = `rgba(0,0,0,${a * .4})`; ctx.fillText(f.text, f.x + 2, f.y + 2);
    ctx.globalAlpha = a; ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
  }
}

/* ---------- ЦИКЪЛ ---------- */
let last = performance.now();
function loop(now){
  let dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;
  if (state !== 'pause'){
    if (slow > 0){ slow -= dt; dt *= .35; }
    update(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- СТАРТ ---------- */
window.addEventListener('resize', resize);
resize();
speed = 240 * k;
$('bestMenu').textContent = best;
renderHearts();
requestAnimationFrame(loop);
</script>
